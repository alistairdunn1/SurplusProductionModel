name: bayesian-tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly at 2 AM UTC on Sundays
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  bayesian-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      MAKEFLAGS: -j2

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev libtbb-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
            any::RTMB
            any::rstan
            any::tmbstan
            local::.

      - name: Run Bayesian-path tests
        run: |
          pkgload::load_all('.')
          testthat::test_dir('tests/testthat', filter = 'bayesian|depletion-target-consistency')
        shell: Rscript {0}
